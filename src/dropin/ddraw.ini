; cnc-ddraw settings for Big Red Racing with Big Red Launcher.
; cnc-ddraw (github.com/FunkyFr3sh/cnc-ddraw, MIT licence) is the open-source
; DirectDraw that draws the game on modern Windows, Wine and Proton. Any setting
; not listed here keeps cnc-ddraw's own default.

[ddraw]
; --- Display mode: keep this in step with [display] mode in BRRFIX.INI ---
; mode=windowed (the default): Big Red Launcher draws the game's own window itself, so
;   cnc-ddraw must leave the window alone: windowed=true.
; mode=fullscreen: cnc-ddraw fills the screen: windowed=false.
; (The launcher sets this for you.)
windowed=true
; Don't intercept the game's window functions (needed for the game's own window,
; and fine in full screen).
hook=0

; --- Full-screen scaling (when windowed=false). Pick one preset. ---
; Comparison screenshots: docs/reports/phase-3a-drop-in-fix.md, "Scaling".

; Preset "integer" (the default): sharp, square pixels, the largest whole-number
; scale that fits, with black borders. 4x on the Steam Deck (1280x800, no borders),
; 5x on 1920x1080.
boxing=true
maintas=true
aspect_ratio=
shader=Shaders\nearest-neighbor.glsl
d3d9_filter=0

; Preset "4:3 sharp": the picture at the 4:3 shape a 1996 monitor gave it, as big
; as fits; sharp, with very slight halos at edges.
;boxing=false
;maintas=true
;aspect_ratio=4:3
;shader=Shaders\interpolation\lanczos2-sharp.glsl
;d3d9_filter=0

; Preset "4:3 nearest": the same shape, plain pixels (some rows and columns of
; pixels end up one screen pixel wider than others).
;boxing=false
;maintas=true
;aspect_ratio=4:3
;shader=Shaders\nearest-neighbor.glsl
;d3d9_filter=0

; Preset "stretch": fills the whole screen, whatever its shape.
;boxing=false
;maintas=false
;aspect_ratio=
;shader=Shaders\nearest-neighbor.glsl
;d3d9_filter=0

; Preset "smooth" (cnc-ddraw's own default filter, slightly blurry):
;boxing=false
;maintas=true
;aspect_ratio=
;shader=Shaders\interpolation\catmull-rom-bilinear.glsl
;d3d9_filter=1

; --- Pacing: Big Red Launcher paces the frames ([clock] in BRRFIX.INI) ---
; maxgameticks=0 leaves the game's frame rate alone; maxfps=-1 redraws the screen
; at its refresh rate. vsync=true removes tearing in full screen (more input lag).
maxgameticks=0
maxfps=-1
vsync=false

; --- Other ---
; renderer=auto uses Direct3D 9 or OpenGL, GDI as a fallback. The shader= lines apply
; to OpenGL, d3d9_filter= to Direct3D 9 (0 = sharp; lanczos is OpenGL only).
renderer=auto
adjmouse=true
; Don't write window positions back into this file.
savesettings=0
