; cnc-ddraw settings for Big Red Racing with Big Red Launcher.
; cnc-ddraw (github.com/FunkyFr3sh/cnc-ddraw, MIT licence) is the open-source
; DirectDraw that draws the game on modern Windows, Wine and Proton. It's the
; file CNCDD.DLL (cnc-ddraw's ddraw.dll, renamed), which the launcher's
; WINRACEP.EXE loads by that name, so no other DirectDraw can take its place. Any
; setting not listed here keeps cnc-ddraw's own default.

[ddraw]
; --- Display mode: keep this in step with [display] mode and renderer in BRRFIX.INI ---
; mode=fullscreen (the default): cnc-ddraw fills the screen: windowed=false.
; mode=windowed: windowed=true. With the Modern renderer the game runs full
;   screen and cnc-ddraw shows it in a window (Alt+Enter: full screen); with the
;   Original renderer it's the game's own window, which Big Red Launcher draws.
; (The launcher sets this for you.)
windowed=false
; Full screen, and the Modern renderer's window, are cnc-ddraw's work: hook=3
; (what it chose itself from its default, 4, when the game loaded it as
; ddraw.dll), devmode=false, adjmouse=true. In the Original renderer's window
; Big Red Launcher draws and scales the picture and the mouse itself, so
; cnc-ddraw mustn't hook the game's window functions (hook=0), lock the pointer
; to its own idea of the window (devmode=true) or scale the mouse again
; (adjmouse=false). (The launcher sets these for you, with the mode.)
hook=3
devmode=false
adjmouse=true
; Full screen at the desktop's own resolution (fullscreen=true), instead of switching the
; screen to the game's 640x480 and letting the monitor blur it up. (Set with the mode.)
fullscreen=true
; Alt+Enter switches the Modern renderer's window to full screen at the desktop's own
; resolution (toggle_upscaled=true), not by changing the screen's mode. (Set with the renderer.)
toggle_upscaled=true

; --- Full-screen scaling (when windowed=false). Pick one preset. ---
; In the Original renderer's window, use the "stretch" preset's boxing=false and maintas=false:
; otherwise, under Wine, cnc-ddraw moves the mouse by the black borders it would draw. The
; Modern renderer: "stretch" in full screen (its picture is already the screen's size), and
; "integer" in its window, for Alt+Enter's full screen. (The launcher does this.)
; Comparison screenshots: docs/reports/phase-3a-drop-in-fix.md, "Scaling".

; Preset "integer" (the default): sharp, square pixels, the largest whole-number
; scale that fits, with black borders. 4x on the Steam Deck (1280x800, no borders),
; 5x on 1920x1080.
boxing=true
maintas=true
aspect_ratio=
shader=Shaders\nearest-neighbor.glsl
d3d9_filter=0

; Preset "4:3 sharp": the picture at the 4:3 shape a 1996 monitor gave it, as big
; as fits; sharp, with very slight halos at edges.
;boxing=false
;maintas=true
;aspect_ratio=4:3
;shader=Shaders\interpolation\lanczos2-sharp.glsl
;d3d9_filter=0

; Preset "4:3 nearest": the same shape, plain pixels (some rows and columns of
; pixels end up one screen pixel wider than others).
;boxing=false
;maintas=true
;aspect_ratio=4:3
;shader=Shaders\nearest-neighbor.glsl
;d3d9_filter=0

; Preset "stretch": fills the whole screen, whatever its shape.
;boxing=false
;maintas=false
;aspect_ratio=
;shader=Shaders\nearest-neighbor.glsl
;d3d9_filter=0

; Preset "smooth" (cnc-ddraw's own default filter, slightly blurry):
;boxing=false
;maintas=true
;aspect_ratio=
;shader=Shaders\interpolation\catmull-rom-bilinear.glsl
;d3d9_filter=1

; --- Pacing: Big Red Launcher paces the frames ([clock] in BRRFIX.INI) ---
; maxgameticks=0 leaves the game's frame rate alone; maxfps=-1 redraws the screen
; at its refresh rate. vsync=true removes tearing in full screen (more input lag).
maxgameticks=0
maxfps=-1
vsync=false

; --- Other ---
; renderer=auto uses Direct3D 9 or OpenGL, GDI as a fallback. The shader= lines apply
; to OpenGL, d3d9_filter= to Direct3D 9 (0 = sharp; lanczos is OpenGL only).
renderer=auto
; Don't write window positions back into this file.
savesettings=0
