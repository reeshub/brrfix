; Big Red Launcher (by ctrl-alt-rees): settings. Keep this file next to Big Red Racing.exe.
; If it's missing, these defaults are used. 1 = on, 0 = off.

[launcher]
; game: the folder with the installed game (WINRACE.EXE and the rest): Game, next to
; Big Red Racing.exe, or a full path (such as C:\BIGRED). Its files are left as they
; are: the launcher runs its own copy, WINRACEP.EXE, made beside it.
game=Game
; skip: 1 = start the game without the settings window (hold Shift to see it).
skip=0

[fixes]
; Replace the direct reads of the VGA card that crash on modern Windows and Proton.
vga=1
; A steady clock from Windows' high-resolution timer instead of a 14 ms timer.
clock=1
; Catch up at most catch_up_cap ticks per frame after a hiccup (original: 35).
cap=1
; Draw vehicles smoothly between physics steps (needs clock=1).
interpolation=1
; Fix two camera calculations that depended on the frame rate.
camera=1
; One key press, one choice in the menus: on fast PCs a press could also act on the
; next screen (or go back two screens), because the next screen appeared before the
; game had seen the key let go.
menu_keys=1
; Remove the switch between the window and full screen (the Modes menu's Full
; screen item, and Tab), which breaks the window: quit and start again to switch.
mode_switch=1

[display]
; mode: fullscreen = full screen without asking (the default);
; windowed = a window: with the Modern renderer, cnc-ddraw's window (the game runs
; full screen in it; no menu bar; Alt+Enter for full screen); with the original, the
; game's own window with its menu bar at the game's own size, as on a 1996 desktop
; (needs cnc-ddraw, or a 256-colour desktop; otherwise the game asks as it did);
; ask = the original question.
mode=fullscreen
; resolution: high = the game's 640x480 mode (the default); low = 320x200, as the game
; starts. Set before the game starts. With the original renderer keypad + and - (and
; the window's Modes menu) still switch, as in 1996; the Modern renderer keeps it.
resolution=high
; renderer: new = the Modern renderer: each picture handed to cnc-ddraw at its own size
; (the menus' 320x200, races' 640x480 or bigger), with no black borders, and enlarged by
; cnc-ddraw's scaling (modern_scaling) to fill the screen or the window (the default); and
; the improvements below. original = the 1996 game's own drawing, which cnc-ddraw scales in
; full screen (fullscreen_scaling), with the window at the game's own size and the game's
; own draw distance sliders, whatever window_scale and max_draw_distance say. The Modern renderer is for Windows 2000 onwards, Wine and
; Proton, and needs cnc-ddraw; on Windows 95, 98 and ME, or without it, the original is used.
renderer=new
; render_resolution: how many pixels races and the attract-mode demo are drawn with, by
; the Modern renderer (the launcher's Resolution "Max"). original = the game's 640x480.
; max (the default) = render_max_height's part of the screen's or window's height, 4:3 or
; (widescreen, below) the screen's shape, for cnc-ddraw to enlarge. The HUD is laid over it
; (hud, below); split-screen races and menus stay as they are.
render_resolution=max
; render_max_height: Max's rows (the launcher's "Max limit"): 1/2 (the default), 1/3, 1/4 or
; 1/5 = that part of the screen's or window's height, which cnc-ddraw enlarges to fill it
; (exactly, on common screens: 960x540 on 1920x1080, 640x400 on 1280x800); screen = all of
; it (up to 6132 rows). Never fewer than 200 rows and 320 columns, the game's own low
; resolution. The game draws in software, so rows cost frame rate: at 2160 rows (a 4K
; screen) a fast PC draws about 25 race frames a second. A number (1080, from older
; versions) means at most that many rows.
render_max_height=1/2
; widescreen: with max, in full screen on a screen wider than 4:3: 1 (the default) = races
; at the screen's own shape (1280x800 on the Steam Deck, 1920x1080 on 1080p), seeing as
; much from top to bottom as 4:3 and more at the sides; the menus 4:3, enlarged by whole
; numbers in the middle of a picture of the screen's shape (their backgrounds across it, or
; black bars at the sides: widescreen_menus, below), which cnc-ddraw enlarges to fill the
; screen's height. cnc-ddraw must keep the picture's shape (ddraw.ini aspect_ratio empty, which
; the launcher writes). 0 = 4:3 races. A window is 4:3, so it has no effect there.
widescreen=1
; widescreen_menus: with native widescreen (above), 1 (the default) = each menu's background
; picture across the whole screen, nearest pixel (sharp), at the menu's pixel shape: pinned to
; the bottom (its top cropped); the race-choosing globe's centred (top and bottom cropped,
; and the globe drawn with square pixels, so it's round); each level's picture placed to
; keep its title in view. The menu itself (text, buttons, the 3D) stays 4:3 in the middle,
; where the mouse expects it. 0 = black bars at the sides.
widescreen_menus=1
; language: ENG (the default), USA, FRE, GER, ITA, SPA or JAP (the window's Language
; menu). Set before the game starts; players' own .CFG files don't change it.
language=ENG
; fullscreen_scaling: the launcher's full-screen choice for the original renderer: its
; "Scaling aspect" and "Scaling". Square: squaresharp (Sharp, the default), squarenearest (Nearest),
; smooth (Smooth), integer (Integer) or stretch (Stretch); 4:3: 43sharp,
; 43nearest, 43smooth or 43stretch. The launcher writes its settings into ddraw.ini.
fullscreen_scaling=squaresharp
; modern_scaling: the launcher's choice for the Modern renderer, in full screen and in its
; window, from the same list; squaresharp (Square, Sharp) by default: the picture's own
; shape (square pixels: 320x200 menus are wider than 4:3, except with native widescreen,
; which draws them 4:3 itself) filling the screen's height, sharpened.
modern_scaling=squaresharp
; window_scale: the Modern renderer's window, in whole multiples of 640x480 (the launcher
; writes the size into ddraw.ini's width and height): auto = the largest that fits on the
; screen; or 1 to 8.
window_scale=auto
; show_version: 1 = the main menu shows "V2.25WR FIX0.1.0" (the installed patch, which
; the game itself still called V2.24, and Big Red Launcher's version) instead of
; "V2.24WR (09-05-96)", so screenshots and bug reports show them.
show_version=1
; max_draw_distance: the Modern renderer; how far races and replays are drawn, in
; landscape squares: the ground, scenery and other vehicles. 0 = the game's own sliders.
; 25 = the furthest the engine's visible-area grid holds (the slider stops
; at 22; in widescreen the sides are filled by extra passes). 26 to 60 = further still, in
; extra passes (44 the launcher's Far, 60 its Max out, the default: the most the engine's
; numbers allow). The in-game sliders are ignored unless 0. Further costs frame rate.
max_draw_distance=60
; texture_distance: with max_draw_distance, how far the ground is textured: draw (the
; default) = as far as it's drawn; a number of squares (25 the launcher's choice); slider =
; the options menu's own (the game stops it at 14). Beyond, plain shaded colour: quicker.
texture_distance=draw
; object_shading: the Modern renderer; how trees, buildings and vehicles are lit. flat (the
; default) = by face, everywhere; smooth = from their corners, everywhere; game (the
; launcher's Original) = smooth near and by face beyond 8 squares, as the game (objects
; change as they pass, darker close up).
object_shading=flat
; object_detail: the Modern renderer; which of a model's versions is drawn (the game keeps
; up to six per model, simpler with distance, and none beyond the last, 39 squares).
; highest (the default) = always the most detailed, at any distance (more to draw);
; matched = by its size on screen: the depth it would have in the game's 640-wide picture,
; so fences and barriers don't change shape close up and objects reach the far draw
; distances; original = by distance, as the game.
object_detail=highest
; object_lighting: 1 (the default) = objects drawn after a dust or smoke cloud are lit;
; the game left them unlit until the next of a few kinds (0 = as the game).
object_lighting=1
; precise_3d: 1 (the default) = the 3D engine's corner positions, facing tests and
; screen-edge clipping worked out in 64 bits; the game's 32 bits overflowed at today's
; resolutions (spikes across the picture, faces missing or inside out, objects vanishing at
; the screen's sides). 0 = as the game.
precise_3d=1
; ground_perspective: the Modern renderer; 1 (the default) = every textured ground square
; drawn perspective-correct, with more precision than the engine kept; the game drew squares
; beyond 4 squares a cheaper way, and the texture jumped where they met (banks twitched as
; you came near). About 1 ms a frame more. 0 = as the game.
ground_perspective=1
; sort_footprint: the Modern renderer; 1 (the default) = objects put in drawing order by their
; footprint's radius, not their bounding sphere's (which counts their height): the ground is
; drawn without the depth buffer, so a tree sorted 2 squares nearer than it was drew over the
; hill in front of it. 0 = as the game.
sort_footprint=1
; close_gaps: the Modern renderer; 1 (the default) = level pieces placed one unit past a
; multiple of 256 (about half the joins: Italy's tunnels, the start's billboards; the level
; editor's off-by-one) drawn on it, and polygon edges' slopes worked out in full instead of
; from a 16-bit reciprocal (slits of sky at today's resolutions). 0 = as the game.
close_gaps=1
; horizon_culling: the Modern renderer, with close_gaps; experimental, 0 (the default) = off.
; 1 = before the engine paints the scene (far to near), ground squares and objects that
; nearer ground will paint over anyway are left out: the same picture, pixel for pixel. So far
; it saves about as much time as it takes (1.5-2 ms a frame at 1080 rows on Kenya), as the
; hidden far squares are cheap for the engine to paint; the log (log=1) shows how much it
; skipped and the time.
horizon_culling=0
; full_colour: with the Modern renderer, 1 = the picture is made in full colour (32 bits)
; from the game's own 256 colours, so that the improvements below needn't share the
; game's palette (the default); 0 = 256 colours, as the game made them.
full_colour=1
; smooth_sky: with full_colour, 1 = the sky (and the haze below the horizon) as a smooth
; gradient, worked out for every pixel of the final picture, instead of the game's 16
; flat bands (the default); 0 = the game's bands.
smooth_sky=1
; smooth_shading: with full_colour, 1 = lit surfaces (buildings, trees, vehicles, tunnel
; walls) shaded smoothly: the game steps a whole palette shade at a time, and the shade
; between two steps is worked out for each pixel instead (the default); 0 = the game's steps.
smooth_shading=1
; hud: the race dashboard with the Modern renderer. lowres (the default) = the game's
; 320x200 art (as its low resolution showed it), drawn by the game on layers of its own
; and laid over the race picture enlarged by whole numbers (3x4 on a 1056x792 race, 4x5
; on 1440x1080), each part pinned to its corner, whatever the picture's size or shape;
; game = the game's own, drawn into the 3D picture and scaled with it (the 640x480 art).
; Split-screen races always have the game's own.
hud=lowres
; hud_size: with hud=lowres, small (the default) = each HUD pixel about a 400th of the
; picture's height (2 screen pixels on 800 and 900 rows, 3 on 1080, 4 on 1440), at least 2;
; large = a 200th, the size the 1996 low resolution showed it (4, 5, 5, 7). The map at
; the top left and the place at the top right sit the same distance from their edges; the
; nitro and laps line up under the place; the messages are centred.
hud_size=small
; hud_map: with hud=lowres, large (the default) = the track map (the 320x200 art, like the
; rest) enlarged twice as much as the rest of the HUD; small = the same as the rest.
hud_map=large
; hud_aspect43: with hud=lowres, 1 = the HUD's pixels 1.2 times taller than wide, as on a
; 1996 4:3 monitor (2x2 at small on 800 rows, 3x4 at large); 0 (the default) = square.
hud_aspect43=0
; colour_animation: 1 = the colour cycling of CHOPPER3, CITY4 (Italy), MOON2 and RIG4
; (their "palanim" lines), which the DOS version runs and the Windows version lost (the
; default; both renderers; needs [fixes] clock=1); 0 = still, as the Windows version.
colour_animation=1

[clock]
; qpc = high-resolution clock (needed for clock=1); original = copy the 1996
; TIMER.DLL exactly (14 ms timer, 71.4 ticks a second) and log when ticks arrive.
source=qpc
; Ticks per second. 70.0 is the DOS version's rate, which matches real seconds (the
; default); 71.43 is the rate the 1996 Windows version ran at, 2% fast.
tick_rate=70.0
catch_up_cap=8
; Frame pacing. The game's physics runs at tick_rate whatever these say.
; frame_limit: auto = no faster than the display's refresh rate; 0 = unlocked
; (as fast as possible); or a number of frames per second.
frame_limit=auto
; vsync: 1 = wait for the screen's vertical blank before showing each frame in a
; window, for no tearing (a full-screen picture is already synchronised). With
; cnc-ddraw, use its own setting instead: vsync=true in ddraw.ini.
vsync=0
; pacing: dropin = Big Red Launcher paces the frames (exactly, at frame_limit);
; cnc-ddraw = leave it to cnc-ddraw when it's in use (its maxgameticks setting in
; ddraw.ini), ignoring the two settings above.
pacing=dropin

[interpolation]
; How far behind real time the picture is drawn, in ticks (2 = one physics step).
delay=2.0

[camera]
; The camera stutter fixes (docs/reports/stutter-hunt.md). Drawing only: the game's
; physics are exactly the same either way. 1 = on (the default), 0 = the original.
; fine_angles: draw the camera and the vehicles with angles finer than the 3D engine's
; 0.35-degree steps, which make the picture jolt up and down while the camera moves.
fine_angles=1
; roll_fix: the follow camera's bank (Elasticam) worked out from its yaw over 7 ticks,
; as at 1996 frame rates, instead of over 1 tick, where it flicks by about 1 degree
; at every yaw step. Best with fine_angles=1.
roll_fix=1
; smoothing: EXPERIMENTAL low-pass filter on the drawn camera's height, pitch and
; roll; 0 = off. Not needed by the fixes above.
smoothing=0

[music]
; The game's CD music, played from ripped tracks instead of the CD: put them in
; the folder below, one file per CD track, named by track number (track02.flac,
; Track02.ogg, 02.wav, "02 - Title.flac" and so on; FLAC, Ogg Vorbis or 16-bit
; WAV). "Install Game Files.bat" makes them from the game's disc image. With no
; tracks there, the game uses a real CD drive, if there is one.
music=1
; folder: next to Big Red Racing.exe, or a full path.
folder=Music
; volume: 0 to 100 (percent), on top of the game's own CD volume option.
volume=100
; follow_game_volume: 1 = the game's CD volume option and its fades apply.
follow_game_volume=1

[sound]
; distance_volume: 1 (the default) = sound effects at their full volume range, so other
; vehicles fade with distance as the game meant (full within about 1.6 squares of the camera,
; silent at 16): on Windows the game gave DirectSound a volume table in the wrong units, so
; every sound played within 1.1 dB of full, near or far. This also gives the game's own
; effects volume option its full range. The vehicles' sounds are gathered nearest first, so
; the 3 engines heard at once are the nearest trucks'. 0 = as the 1996 Windows version.
distance_volume=1
; stereo_pan: 1 (the default) = a vehicle's sounds lean towards its side as a balance: the far
; speaker's level falls in proportion to how far round it is (half way: 6 dB quieter; fully
; to one side: silent), as the DOS version pans. The 1996 Windows version passed its pan
; straight into DirectSound's decibel scale, so a truck 30 degrees off centre was 50 dB down
; on the far speaker: almost everything sat hard left or hard right. 0 = as the game.
stereo_pan=1
; channels: 32 (the default) or 16 = that many sound channels and requests an update
; instead of the game's 8 (one busy truck could fill all 8: four loops and four knocks), and
; every truck's engine (the game played 3); the nearest come first. 8 = as the game.
channels=32

[controller]
; A modern pad (XInput: Xbox and compatible pads, Steam Deck) as the game's
; joystick: left stick steers; with layout=triggers the right trigger accelerates
; and the left one brakes and reverses (layout=stick: stick up and down, as the
; original); A and B are joystick buttons 1 and 2. In the game, choose the
; joystick in the controls menu. Not on Windows 95/98/ME (no XInput).
enabled=1
; deadzone: how far the stick moves before steering starts, in percent (0-60).
deadzone=15
; sensitivity: full lock at this percent of the stick's travel (100 = at the end).
sensitivity=100
; curve: 100 = straight; higher = gentler near the centre (up to 300).
curve=150
layout=triggers
; analogue: 1 = steer in proportion to the stick (the game's own analogue
; joystick support); 0 = on or off, as a digital joystick.
analogue=1
; vibration: 1 = a brief buzz from the pad whenever player one's vehicle takes
; damage (a longer one when it's wrecked). Needs the game's damage option on
; (it is unless you turn it off in the game's menus).
vibration=1
; nitro_rumble: 1 = a steady rumble while player one's nitro boost flames show.
nitro_rumble=1
; vibration_intensity: the damage buzz's strength, in percent of the motors'
; power (0-100); the nitro rumble runs at half of it.
vibration_intensity=80
; menu_navigation: 1 = in the menus, joystick button 2 (B on a pad) goes back, as
; Esc (and quits where Esc quits), and the stick's (or D-pad's) left and right change
; the race, logo or car, as the arrow keys (the default). Button 1 (A) already
; chooses, as in 1996. Any joystick, with or without enabled=1; not on the keys or
; joystick screens.
menu_navigation=1

[log]
; BRRFIX.LOG: what was patched, and clock statistics every 10 seconds. Turn it on
; (log=1) for bug reports.
log=0
clock=1
; BRRFIX-STATE.CSV: every vehicle's physics state on every tick (large).
state=0
; BRRFIX-CAMERA.CSV: the camera on every drawn frame (large).
camera=0
; Check after every draw that the vehicle records are exactly as before it.
check_restore=0
