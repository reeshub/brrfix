; Big Red Launcher (by ctrl-alt-rees): settings. Put this file next to WINRACE.EXE.
; If it's missing, these defaults are used. 1 = on, 0 = off.

[fixes]
; Replace the direct reads of the VGA card that crash on modern Windows and Proton.
vga=1
; A steady clock from Windows' high-resolution timer instead of a 14 ms timer.
clock=1
; Catch up at most catch_up_cap ticks per frame after a hiccup (original: 35).
cap=1
; Draw vehicles smoothly between physics steps (needs clock=1).
interpolation=1
; Fix two camera calculations that depended on the frame rate.
camera=1

[display]
; mode: windowed = the game's own window with its menu bar, as on a 1996 desktop
; (needs cnc-ddraw, or a 256-colour desktop; otherwise the game asks as it did);
; fullscreen = full screen without asking; ask = the original question.
mode=windowed
; window_scale: how big the window is, in whole multiples of the game's picture:
; auto = the largest that fits on the screen; or 1 to 8.
window_scale=auto
; aspect: square = square pixels (sharp); 4:3 = the height stretched by 1.2, as a
; 1996 monitor showed the game's 320x200 picture.
aspect=square
; show_version: 1 = the main menu shows "V2.24WR FIX0.1.0" (Big Red Launcher's version)
; instead of the build date "(09-05-96)", so screenshots and bug reports show it.
show_version=1

[clock]
; qpc = high-resolution clock (needed for clock=1); original = copy the 1996
; TIMER.DLL exactly (14 ms timer, 71.4 ticks a second) and log when ticks arrive.
source=qpc
; Ticks per second. 70.0 matches the DOS version and real seconds; the original
; Windows version ran at 71.43.
tick_rate=70.0
catch_up_cap=8
; Frame pacing. The game's physics runs at tick_rate whatever these say.
; frame_limit: auto = no faster than the display's refresh rate; 0 = unlocked
; (as fast as possible); or a number of frames per second.
frame_limit=auto
; vsync: 1 = wait for the screen's vertical blank before showing each frame in a
; window, for no tearing (a full-screen picture is already synchronised). With
; cnc-ddraw, use its own setting instead: vsync=true in ddraw.ini.
vsync=0
; pacing: dropin = Big Red Launcher paces the frames (exactly, at frame_limit);
; cnc-ddraw = leave it to cnc-ddraw when it's in use (its maxgameticks setting in
; ddraw.ini), ignoring the two settings above.
pacing=dropin

[interpolation]
; How far behind real time the picture is drawn, in ticks (2 = one physics step).
delay=2.0

[camera]
; The camera stutter fixes (docs/reports/stutter-hunt.md). Drawing only: the game's
; physics are exactly the same either way. 1 = on (the default), 0 = the original.
; fine_angles: draw the camera and the trucks with angles finer than the 3D engine's
; 0.35-degree steps, which make the picture jolt up and down while the camera moves.
fine_angles=1
; roll_fix: the follow camera's bank (Elasticam) worked out from its yaw over 7 ticks,
; as at 1996 frame rates, instead of over 1 tick, where it flicks by about 1 degree
; at every yaw step. Best with fine_angles=1.
roll_fix=1
; smoothing: EXPERIMENTAL low-pass filter on the drawn camera's height, pitch and
; roll; 0 = off. Not needed by the fixes above.
smoothing=0

[music]
; The game's CD music, played from ripped tracks instead of the CD: put them in
; the folder below, one file per CD track, named by track number (track02.flac,
; Track02.ogg, 02.wav, "02 - Title.flac" and so on; FLAC, Ogg Vorbis or 16-bit
; WAV). python3 brr.py prepare makes them from the disc image. With no tracks
; there, the game uses a real CD drive, if there is one.
music=1
; folder: next to the game, or a full path.
folder=MUSIC
; volume: 0 to 100 (percent), on top of the game's own CD volume option.
volume=100
; follow_game_volume: 1 = the game's CD volume option and its fades apply.
follow_game_volume=1

[controller]
; A modern pad (XInput: Xbox and compatible pads, Steam Deck) as the game's
; joystick: left stick steers; with layout=triggers the right trigger accelerates
; and the left one brakes and reverses (layout=stick: stick up and down, as the
; original); A and B are joystick buttons 1 and 2. In the game, choose the
; joystick in the controls menu. Not on Windows 95/98/ME (no XInput).
enabled=1
; deadzone: how far the stick moves before steering starts, in percent (0-60).
deadzone=15
; sensitivity: full lock at this percent of the stick's travel (100 = at the end).
sensitivity=100
; curve: 100 = straight; higher = gentler near the centre (up to 300).
curve=150
layout=triggers
; analogue: 1 = steer in proportion to the stick (the game's own analogue
; joystick support); 0 = on or off, as a digital joystick.
analogue=1

[log]
; BRRFIX.LOG: what was patched, and clock statistics every 10 seconds.
log=1
clock=1
; BRRFIX-STATE.CSV: every vehicle's physics state on every tick (large).
state=0
; BRRFIX-CAMERA.CSV: the camera on every drawn frame (large).
camera=0
; Check after every draw that the vehicle records are exactly as before it.
check_restore=0
