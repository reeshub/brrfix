; Big Red Launcher (by ctrl-alt-rees): settings. Keep this file next to Big Red Racing.exe.
; If it's missing, these defaults are used. 1 = on, 0 = off.

[launcher]
; game: the folder with the installed game (WINRACE.EXE and the rest): Game, next to
; Big Red Racing.exe, or a full path (such as C:\BIGRED). Its files are left as they
; are: the launcher runs its own copy, WINRACEP.EXE, made beside it.
game=Game
; skip: 1 = start the game without the settings window (hold Shift to see it).
skip=0

[fixes]
; Replace the direct reads of the VGA card that crash on modern Windows and Proton.
vga=1
; A steady clock from Windows' high-resolution timer instead of a 14 ms timer.
clock=1
; Catch up at most catch_up_cap ticks per frame after a hiccup (original: 35).
cap=1
; Draw vehicles smoothly between physics steps (needs clock=1).
interpolation=1
; Fix two camera calculations that depended on the frame rate.
camera=1
; One key press, one choice in the menus: on fast PCs a press could also act on the
; next screen (or go back two screens), because the next screen appeared before the
; game had seen the key let go.
menu_keys=1
; Remove the switch between the window and full screen (the Modes menu's Full
; screen item, and Tab), which breaks the window.
mode_switch=1

[display]
; mode: fullscreen = full screen without asking (the default);
; windowed = the game's own window with its menu bar, as on a 1996 desktop
; (needs cnc-ddraw, or a 256-colour desktop; otherwise the game asks as it did);
; ask = the original question.
mode=fullscreen
; resolution: high = the game's 640x480 mode (the default; keypad + in the game);
; low = 320x200, as the game starts (keypad -). Set before the game starts.
resolution=high
; renderer: new = the picture made once, at the screen's own resolution (full screen) or
; the window's (windowed), in whole-number sizes on black, and shown by cnc-ddraw or GDI
; with no scaling of their own: sharp at any size (the default). original = the game's
; own drawing, which cnc-ddraw scales in full screen (fullscreen_scaling). The new
; renderer is for Windows 2000 onwards, Wine and Proton, and needs cnc-ddraw in full
; screen; on Windows 95, 98 and ME, or without cnc-ddraw, the original is used.
renderer=new
; render_resolution: experimental; how many pixels races and the attract-mode demo are
; drawn with, by the new renderer. original = the game's 640x480 (the default). max = up
; to 1008x756, the most the game's 3D engine can draw: the 4:3 size that, enlarged by a
; whole number, fills the most of the screen or window (for example 1008x756 on
; 1280x800 or 1600x900, 720x540 doubled on 1920x1080). The HUD is the game's own,
; scaled by its own code; split-screen races and menus stay as they are.
render_resolution=original
; language: ENG (the default), USA, FRE, GER, ITA, SPA or JAP (the window's Language
; menu). Set before the game starts; players' own .CFG files don't change it.
language=ENG
; fullscreen_scaling: the launcher's full-screen choice for the original renderer
; (integer, 43sharp, 43nearest, stretch or smooth). The launcher writes its settings
; into ddraw.ini; with the new renderer it writes "stretch", which adds nothing.
fullscreen_scaling=integer
; window_scale: how big the window is, in whole multiples of the game's picture:
; auto = the largest that fits on the screen; or 1 to 8.
window_scale=auto
; aspect: 4:3 = the 320x200 pictures (the menus, and low resolution) at the shape a
; 1996 monitor gave them, pixels a fifth taller than wide: with the new renderer the
; whole-number sizes nearest that shape, with the original in a window only;
; square = square pixels (sharp). 640x480 already has the 4:3 shape.
aspect=4:3
; show_version: 1 = the main menu shows "V2.25WR FIX0.1.0" (the installed patch, which
; the game itself still called V2.24, and Big Red Launcher's version) instead of
; "V2.24WR (09-05-96)", so screenshots and bug reports show them.
show_version=1
; max_draw_distance: experimental; how far races and replays are drawn, in landscape
; squares. 0 = the game's own sliders (the default). 25 = the furthest the engine's
; visible-area grid holds (the slider stops at 22), textured all the way (the slider
; stops at 14). 26 to 60 = the ground further still, in extra passes (44 = double);
; scenery stays at 25. The in-game sliders are ignored unless 0.
max_draw_distance=0

[clock]
; qpc = high-resolution clock (needed for clock=1); original = copy the 1996
; TIMER.DLL exactly (14 ms timer, 71.4 ticks a second) and log when ticks arrive.
source=qpc
; Ticks per second. 70.0 is the DOS version's rate, which matches real seconds (the
; default); 71.43 is the rate the 1996 Windows version ran at, 2% fast.
tick_rate=70.0
catch_up_cap=8
; Frame pacing. The game's physics runs at tick_rate whatever these say.
; frame_limit: auto = no faster than the display's refresh rate; 0 = unlocked
; (as fast as possible); or a number of frames per second.
frame_limit=auto
; vsync: 1 = wait for the screen's vertical blank before showing each frame in a
; window, for no tearing (a full-screen picture is already synchronised). With
; cnc-ddraw, use its own setting instead: vsync=true in ddraw.ini.
vsync=0
; pacing: dropin = Big Red Launcher paces the frames (exactly, at frame_limit);
; cnc-ddraw = leave it to cnc-ddraw when it's in use (its maxgameticks setting in
; ddraw.ini), ignoring the two settings above.
pacing=dropin

[interpolation]
; How far behind real time the picture is drawn, in ticks (2 = one physics step).
delay=2.0

[camera]
; The camera stutter fixes (docs/reports/stutter-hunt.md). Drawing only: the game's
; physics are exactly the same either way. 1 = on (the default), 0 = the original.
; fine_angles: draw the camera and the vehicles with angles finer than the 3D engine's
; 0.35-degree steps, which make the picture jolt up and down while the camera moves.
fine_angles=1
; roll_fix: the follow camera's bank (Elasticam) worked out from its yaw over 7 ticks,
; as at 1996 frame rates, instead of over 1 tick, where it flicks by about 1 degree
; at every yaw step. Best with fine_angles=1.
roll_fix=1
; smoothing: EXPERIMENTAL low-pass filter on the drawn camera's height, pitch and
; roll; 0 = off. Not needed by the fixes above.
smoothing=0

[music]
; The game's CD music, played from ripped tracks instead of the CD: put them in
; the folder below, one file per CD track, named by track number (track02.flac,
; Track02.ogg, 02.wav, "02 - Title.flac" and so on; FLAC, Ogg Vorbis or 16-bit
; WAV). python3 brr.py prepare makes them from the disc image. With no tracks
; there, the game uses a real CD drive, if there is one.
music=1
; folder: next to Big Red Racing.exe, or a full path.
folder=Music
; volume: 0 to 100 (percent), on top of the game's own CD volume option.
volume=100
; follow_game_volume: 1 = the game's CD volume option and its fades apply.
follow_game_volume=1

[controller]
; A modern pad (XInput: Xbox and compatible pads, Steam Deck) as the game's
; joystick: left stick steers; with layout=triggers the right trigger accelerates
; and the left one brakes and reverses (layout=stick: stick up and down, as the
; original); A and B are joystick buttons 1 and 2. In the game, choose the
; joystick in the controls menu. Not on Windows 95/98/ME (no XInput).
enabled=1
; deadzone: how far the stick moves before steering starts, in percent (0-60).
deadzone=15
; sensitivity: full lock at this percent of the stick's travel (100 = at the end).
sensitivity=100
; curve: 100 = straight; higher = gentler near the centre (up to 300).
curve=150
layout=triggers
; analogue: 1 = steer in proportion to the stick (the game's own analogue
; joystick support); 0 = on or off, as a digital joystick.
analogue=1
; vibration: 1 = a brief buzz from the pad whenever player one's vehicle takes
; damage (a longer one when it's wrecked). Needs the game's damage option on
; (it is unless you turn it off in the game's menus).
vibration=1
; vibration_strength: how strong the buzz is, in percent (0-100).
vibration_strength=50

[log]
; BRRFIX.LOG: what was patched, and clock statistics every 10 seconds. Turn it on
; (log=1) for bug reports.
log=0
clock=1
; BRRFIX-STATE.CSV: every vehicle's physics state on every tick (large).
state=0
; BRRFIX-CAMERA.CSV: the camera on every drawn frame (large).
camera=0
; Check after every draw that the vehicle records are exactly as before it.
check_restore=0
